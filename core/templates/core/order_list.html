{% extends 'core/base.html' %}

{% block content %}
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">订单管理</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <a href="/admin/core/order/add/" class="btn btn-primary">
                添加订单
            </a>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-sm">
            <thead>
                <tr>
                    <th>订单名称</th>
                    <th>客户</th>
                    <th>描述</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                {% for order in orders %}
                <tr>
                    <td>{{ order.name }}</td>
                    <td>{{ order.client.name }}</td>
                    <td>{{ order.description }}</td>
                    <td>{{ order.created_at|date:"Y-m-d H:i" }}</td>
                    <td>
                        <a href="/admin/core/order/{{ order.id }}/change/" class="btn btn-sm btn-primary">编辑</a>
                        <form action="{% url 'order_delete' order.id %}" method="POST" style="display: inline;">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-sm btn-danger" onclick="return confirm('确定要删除这个订单吗？');">删除</button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
