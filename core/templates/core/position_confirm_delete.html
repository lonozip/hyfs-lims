{% extends 'core/base.html' %}

{% block title %}确认删除职务{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">确认删除职务</h1>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-md-8">
                <div class="card border-danger shadow-sm">
                    <div class="card-header bg-danger text-white">
                        <h5 class="card-title mb-0">警告：此操作不可撤销</h5>
                    </div>
                    <div class="card-body">
                        <p class="lead">您确定要删除职务 <strong>{{ position.name }}</strong> 吗？</p>
                        <p class="text-muted small">注意：如果该职务下有关联的员工，删除操作将被拒绝。</p>
                        <hr>
                        <form method="post">
                            {% csrf_token %}
                            <div class="mt-4">
                                <button type="submit" class="btn btn-danger btn-lg px-4">确认删除</button>
                                <a href="{% url 'org_manage' %}" class="btn btn-secondary btn-lg px-4 ms-2">取消</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
