{% extends 'core/base.html' %}

{% block content %}
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">人员管理</h1>
        <div class="btn-toolbar mb-2 mb-md-0">
            <a href="/admin/core/staff/add/" class="btn btn-primary">
                添加人员
            </a>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped table-sm">
            <thead>
                <tr>
                    <th>人员名称</th>
                    <th>部门</th>
                    <th>电子邮件</th>
                    <th>电话</th>
                    <th>地址</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                {% for staff in staffs %}
                <tr>
                    <td>{{ staff.name }}</td>
                    <td>{{ staff.department }}</td>
                    <td>{{ staff.email }}</td>
                    <td>{{ staff.phone }}</td>
                    <td>{{ staff.address }}</td>
                    <td>{{ staff.created_at|date:"Y-m-d H:i" }}</td>
                    <td>
                        <a href="/admin/core/staff/{{ staff.id }}/change/" class="btn btn-sm btn-primary">编辑</a>
                        <a href="/admin/core/staff/{{ staff.id }}/delete/" class="btn btn-sm btn-danger">删除</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
