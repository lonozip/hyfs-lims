{% extends 'core/base.html' %}

{% block title %}添加员工{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">添加员工</h1>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <form method="post">
                    {% csrf_token %}
                    
                    <!-- 选项卡导航 -->
                    <ul class="nav nav-tabs mb-4" id="staffCreateTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="basic-tab" data-bs-toggle="tab" data-bs-target="#basic" type="button" role="tab" aria-controls="basic" aria-selected="true">基本信息</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="contact-tab" data-bs-toggle="tab" data-bs-target="#contact" type="button" role="tab" aria-controls="contact" aria-selected="false">联系方式</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="account-tab" data-bs-toggle="tab" data-bs-target="#account" type="button" role="tab" aria-controls="account" aria-selected="false">账号管理</button>
                        </li>
                    </ul>

                    <!-- 选项卡内容 -->
                    <div class="tab-content" id="staffCreateTabsContent">
                        <!-- 基本信息页面 -->
                        <div class="tab-pane fade show active" id="basic" role="tabpanel" aria-labelledby="basic-tab">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="name" class="form-label">员工姓名</label>
                                        <input type="text" class="form-control" id="name" name="name" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="department" class="form-label">部门</label>
                                        <select class="form-select" id="department" name="department" required>
                                            {% for department in departments %}
                                                <option value="{{ department.id }}">{{ department.name }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label for="position" class="form-label">职务</label>
                                        <select class="form-select" id="position" name="position">
                                            <option value="">请选择职务</option>
                                            {% for position in positions %}
                                                <option value="{{ position.id }}">{{ position.name }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 联系方式页面 -->
                        <div class="tab-pane fade" id="contact" role="tabpanel" aria-labelledby="contact-tab">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="email" class="form-label">电子邮件</label>
                                        <input type="email" class="form-control" id="email" name="email" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="phone" class="form-label">电话</label>
                                        <input type="text" class="form-control" id="phone" name="phone" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="address" class="form-label">地址</label>
                                        <textarea class="form-control" id="address" name="address" rows="3" required></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 账号管理页面 -->
                        <div class="tab-pane fade" id="account" role="tabpanel" aria-labelledby="account-tab">
                            <div class="row">
                                <div class="col-md-8">
                                    <div class="mb-4">
                                        <div class="form-check form-switch">
                                            <input class="form-check-input" type="checkbox" id="is_active" name="is_active">
                                            <label class="form-check-label" for="is_active">启用登录账号</label>
                                        </div>
                                        <p class="text-muted text-sm">启用后将自动创建用户账号，初始密码为员工编号</p>
                                    </div>
                                    
                                    <div class="card">
                                        <div class="card-header">
                                            <h5>系统权限</h5>
                                        </div>
                                        <div class="card-body">
                                            <div class="row">
                                                <div class="col-md-4">
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="checkbox" id="can_manage_clients" name="can_manage_clients">
                                                        <label class="form-check-label" for="can_manage_clients">客户管理</label>
                                                    </div>
                                                </div>
                                                <div class="col-md-4">
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="checkbox" id="can_manage_orders" name="can_manage_orders">
                                                        <label class="form-check-label" for="can_manage_orders">订单管理</label>
                                                    </div>
                                                </div>
                                                <div class="col-md-4">
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="checkbox" id="can_manage_projects" name="can_manage_projects">
                                                        <label class="form-check-label" for="can_manage_projects">方案管理</label>
                                                    </div>
                                                </div>
                                                <div class="col-md-4">
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="checkbox" id="can_manage_samples" name="can_manage_samples">
                                                        <label class="form-check-label" for="can_manage_samples">样本管理</label>
                                                    </div>
                                                </div>
                                                <div class="col-md-4">
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="checkbox" id="can_manage_tests" name="can_manage_tests">
                                                        <label class="form-check-label" for="can_manage_tests">测试管理</label>
                                                    </div>
                                                </div>
                                                <div class="col-md-4">
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="checkbox" id="can_manage_reports" name="can_manage_reports">
                                                        <label class="form-check-label" for="can_manage_reports">报告管理</label>
                                                    </div>
                                                </div>
                                                <div class="col-md-4">
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="checkbox" id="can_manage_standard" name="can_manage_standard">
                                                        <label class="form-check-label" for="can_manage_standard">标准管理</label>
                                                    </div>
                                                </div>
                                                <div class="col-md-4">
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="checkbox" id="can_manage_staff" name="can_manage_staff">
                                                        <label class="form-check-label" for="can_manage_staff">员工管理</label>
                                                    </div>
                                                </div>
                                                <div class="col-md-4">
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="checkbox" id="can_manage_org" name="can_manage_org">
                                                        <label class="form-check-label" for="can_manage_org">组织架构</label>
                                                    </div>
                                                </div>
                                                <div class="col-md-4">
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="checkbox" id="can_manage_sample_types" name="can_manage_sample_types">
                                                        <label class="form-check-label" for="can_manage_sample_types">样品类型管理</label>
                                                    </div>
                                                </div>
                                                <div class="col-md-4">
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="checkbox" id="can_manage_sample_descriptions" name="can_manage_sample_descriptions">
                                                        <label class="form-check-label" for="can_manage_sample_descriptions">样品类型描述</label>
                                                    </div>
                                                </div>
                                                <div class="col-md-4">
                                                    <div class="form-check">
                                                        <input class="form-check-input" type="checkbox" id="can_access_admin" name="can_access_admin">
                                                        <label class="form-check-label" for="can_access_admin">管理后台</label>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-4 pt-3 border-top">
                        <button type="submit" class="btn btn-primary btn-lg">创建员工</button>
                        <a href="{% url 'staff_list' %}" class="btn btn-secondary btn-lg">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
