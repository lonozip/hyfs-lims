    <h2 class="h4 mt-5">数据可视化</h2>
    
    <!-- 饼图容器 - 样品状态 -->
    <div class="row mb-4">
        <div class="col-md-6">
            <h3 class="h5 mt-3 mb-3">样品状态分布</h3>
            <div class="mb-4" style="height: 350px; width: 100%; max-width: 600px; margin: 20px auto;">
                <canvas id="sampleStatusChart"></canvas>
            </div>
        </div>
        
        <!-- 饼图容器 - 订单状态 -->
        <div class="col-md-6">
            <h3 class="h5 mt-3 mb-3">订单状态分布</h3>
            <div class="mb-4" style="height: 350px; width: 100%; max-width: 600px; margin: 20px auto;">
                <canvas id="orderStatusChart"></canvas>
            </div>
        </div>
    </div>

    <!-- 饼图容器 - 报告状态 -->
    <div class="row mb-4">
        <div class="col-md-6">
            <h3 class="h5 mt-3 mb-3">报告状态分布</h3>
            <div class="mb-4" style="height: 350px; width: 100%; max-width: 600px; margin: 20px auto;">
                <canvas id="reportStatusChart"></canvas>
            </div>
        </div>
    </div>

    <h2 class="h4 mt-5">最近活动</h2>
    <!-- 这里可以添加最近活动的列表 -->
    
    <!-- 引入Chart.js库 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <script>
        // 获取Django传递的JSON数据并解析
        const sampleChartData = JSON.parse('{{ sample_chart_data|safe }}');
        const orderChartData = JSON.parse('{{ order_chart_data|safe }}');
        const reportChartData = JSON.parse('{{ report_chart_data|safe }}');
        
        // 为不同状态设置更友好的标签和颜色
        const statusLabels = {
            'pending': '待处理',
            'in_progress': '处理中',
            'completed': '已完成',
            'cancelled': '已取消'
        };
        
        const statusColors = {
            'pending': '#FF6384',
            'in_progress': '#36A2EB',
            'completed': '#4BC0C0',
            'cancelled': '#FFCE56'
        };
        
        // 辅助函数：格式化饼图数据
        function formatChartData(chartData) {
            const formattedLabels = chartData.labels.map(label => statusLabels[label] || label);
            const formattedColors = chartData.labels.map(label => statusColors[label] || '#999999');
            return {
                labels: formattedLabels,
                colors: formattedColors
            };
        }
        
        // 格式化样品状态数据
        const formattedSampleData = formatChartData(sampleChartData);
        
        // 初始化样品状态饼图
        const sampleCtx = document.getElementById('sampleStatusChart').getContext('2d');
        const sampleStatusChart = new Chart(sampleCtx, {
            type: 'pie',
            data: {
                labels: formattedSampleData.labels,
                datasets: [{
                    data: sampleChartData.values,
                    backgroundColor: formattedSampleData.colors,
                    borderWidth: 1,
                    borderColor: '#ffffff'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            font: {
                                size: 14
                            },
                            padding: 20
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const label = context.label || '';
                                const value = context.raw || 0;
                                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                const percentage = Math.round((value / total) * 100);
                                return `${label}: ${value} (${percentage}%)`;
                            }
                        }
                    }
                }
            }
        });
        
        // 格式化订单状态数据
        const formattedOrderData = formatChartData(orderChartData);
        
        // 初始化订单状态饼图
        const orderCtx = document.getElementById('orderStatusChart').getContext('2d');
        const orderStatusChart = new Chart(orderCtx, {
            type: 'pie',
            data: {
                labels: formattedOrderData.labels,
                datasets: [{
                    data: orderChartData.values,
                    backgroundColor: formattedOrderData.colors,
                    borderWidth: 1,
                    borderColor: '#ffffff'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            font: {
                                size: 14
                            },
                            padding: 20
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const label = context.label || '';
                                const value = context.raw || 0;
                                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                const percentage = Math.round((value / total) * 100);
                                return `${label}: ${value} (${percentage}%)`;
                            }
                        }
                    }
                }
            }
        });

        // 格式化报告状态数据
        const formattedReportData = formatChartData(reportChartData);
        
        // 初始化报告状态饼图
        const reportCtx = document.getElementById('reportStatusChart').getContext('2d');
        const reportStatusChart = new Chart(reportCtx, {
            type: 'pie',
            data: {
                labels: formattedReportData.labels,
                datasets: [{
                    data: reportChartData.values,
                    backgroundColor: formattedReportData.colors,
                    borderWidth: 1,
                    borderColor: '#ffffff'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'top',
                        labels: {
                            font: {
                                size: 14
                            },
                            padding: 20
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const label = context.label || '';
                                const value = context.raw || 0;
                                const total = context.dataset.data.reduce((a, b) => a + b, 0);
                                const percentage = Math.round((value / total) * 100);
                                return `${label}: ${value} (${percentage}%)`;
                            }
                        }
                    }
                }
            }
        });
    </script>
