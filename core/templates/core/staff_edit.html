{% extends 'core/base.html' %}

{% block title %}编辑员工{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">编辑员工</h1>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-md-12">
                <form method="post">
                    {% csrf_token %}
                    
                    <!-- 选项卡导航 -->
                    <ul class="nav nav-tabs mb-4" id="staffEditTabs" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="basic-tab" data-bs-toggle="tab" data-bs-target="#basic" type="button" role="tab" aria-controls="basic" aria-selected="true">基本信息</button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="contact-tab" data-bs-toggle="tab" data-bs-target="#contact" type="button" role="tab" aria-controls="contact" aria-selected="false">联系方式</button>
                        </li>
                    </ul>

                    <!-- 选项卡内容 -->
                    <div class="tab-content" id="staffEditTabsContent">
                        <!-- 基本信息页面 -->
                        <div class="tab-pane fade show active" id="basic" role="tabpanel" aria-labelledby="basic-tab">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="name" class="form-label">员工姓名</label>
                                        <input type="text" class="form-control" id="name" name="name" value="{{ staff.name }}" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="department" class="form-label">部门</label>
                                        <select class="form-select" id="department" name="department" required>
                                            {% for department in departments %}
                                                <option value="{{ department.id }}" {% if department.id == staff.department.id %}selected{% endif %}>{{ department.name }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label for="position" class="form-label">职务</label>
                                        <select class="form-select" id="position" name="position" required>
                                            <option value="">请选择职务</option>
                                            {% for position in positions %}
                                                <option value="{{ position.id }}" {% if position.id == staff.position_link_id %}selected{% endif %}>{{ position.name }}</option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 联系方式页面 -->
                        <div class="tab-pane fade" id="contact" role="tabpanel" aria-labelledby="contact-tab">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="email" class="form-label">电子邮件</label>
                                        <input type="email" class="form-control" id="email" name="email" value="{{ staff.email }}" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="phone" class="form-label">电话</label>
                                        <input type="text" class="form-control" id="phone" name="phone" value="{{ staff.phone }}" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="address" class="form-label">地址</label>
                                        <textarea class="form-control" id="address" name="address" rows="3" required>{{ staff.address }}</textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-4 pt-3 border-top">
                        <button type="submit" class="btn btn-primary btn-lg">保存员工</button>
                        <a href="{% url 'staff_list' %}" class="btn btn-secondary btn-lg">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
