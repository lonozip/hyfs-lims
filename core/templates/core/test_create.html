{% extends 'core/base.html' %}

{% block title %}添加测试{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">添加测试</h1>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="sample" class="form-label">样品</label>
                        <select class="form-select" id="sample" name="sample" required onchange="updateSampleInfo(this)">
                            <option value="">请选择</option>
                            {% for sample in samples %}
                                <option value="{{ sample.id }}" data-sample-type="{{ sample.sample_type.name|default:'' }}" data-sample-desc="{{ sample.sample_type_description.description|default:'' }}">{{ sample.sample_id }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">样品类型</label>
                        <input type="text" class="form-control" id="sample_type_display" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">样品类型描述</label>
                        <input type="text" class="form-control" id="sample_type_desc_display" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">量纲</label>
                        <div class="d-flex gap-2">
                            <select class="form-select flex-1" id="unit_prefix" name="unit_prefix">
                                <option value="">无前缀</option>
                                <optgroup label="中文前缀">
                                    <option value="尧">尧 (Y) - 10²⁴</option>
                                    <option value="泽">泽 (Z) - 10²¹</option>
                                    <option value="艾">艾 (E) - 10¹⁸</option>
                                    <option value="拍">拍 (P) - 10¹⁵</option>
                                    <option value="太">太 (T) - 10¹²</option>
                                    <option value="吉">吉 (G) - 10⁹</option>
                                    <option value="兆">兆 (M) - 10⁶</option>
                                    <option value="千">千 (k) - 10³</option>
                                    <option value="百">百 (h) - 10²</option>
                                    <option value="十">十 (da) - 10¹</option>
                                    <option value="分">分 (d) - 10⁻¹</option>
                                    <option value="厘">厘 (c) - 10⁻²</option>
                                    <option value="毫">毫 (m) - 10⁻³</option>
                                    <option value="微">微 (μ) - 10⁻⁶</option>
                                    <option value="纳">纳 (n) - 10⁻⁹</option>
                                    <option value="皮">皮 (p) - 10⁻¹²</option>
                                    <option value="飞">飞 (f) - 10⁻¹⁵</option>
                                    <option value="阿">阿 (a) - 10⁻¹⁸</option>
                                    <option value="仄">仄 (z) - 10⁻²¹</option>
                                    <option value="幺">幺 (y) - 10⁻²⁴</option>
                                </optgroup>
                                <optgroup label="符号前缀">
                                    <option value="Y">Y (尧)</option>
                                    <option value="Z">Z (泽)</option>
                                    <option value="E">E (艾)</option>
                                    <option value="P">P (拍)</option>
                                    <option value="T">T (太)</option>
                                    <option value="G">G (吉)</option>
                                    <option value="M">M (兆)</option>
                                    <option value="k">k (千)</option>
                                    <option value="h">h (百)</option>
                                    <option value="da">da (十)</option>
                                    <option value="d">d (分)</option>
                                    <option value="c">c (厘)</option>
                                    <option value="m">m (毫)</option>
                                    <option value="μ">μ (微)</option>
                                    <option value="n">n (纳)</option>
                                    <option value="p">p (皮)</option>
                                    <option value="f">f (飞)</option>
                                    <option value="a">a (阿)</option>
                                    <option value="z">z (仄)</option>
                                    <option value="y">y (幺)</option>
                                </optgroup>
                            </select>
                            <select class="form-select flex-1" id="unit_base" name="unit_base">
                                <option value="">选择基础单位</option>
                                <optgroup label="辐射相关">
                                    <option value="Bq">贝可勒尔 (Bq)</option>
                                    <option value="Gy">戈瑞 (Gy)</option>
                                    <option value="Sv">西弗 (Sv)</option>
                                    <option value="Bq/m³">贝可勒尔/立方米 (Bq/m³)</option>
                                    <option value="Sv/h">西弗/小时 (Sv/h)</option>
                                    <option value="μSv/h">微西弗/小时 (μSv/h)</option>
                                </optgroup>
                                <optgroup label="国际单位制">
                                    <option value="m">米 (m)</option>
                                    <option value="kg">千克 (kg)</option>
                                    <option value="s">秒 (s)</option>
                                    <option value="A">安培 (A)</option>
                                    <option value="K">开尔文 (K)</option>
                                    <option value="mol">摩尔 (mol)</option>
                                    <option value="cd">坎德拉 (cd)</option>
                                </optgroup>
                                <optgroup label="导出单位">
                                    <option value="Hz">赫兹 (Hz)</option>
                                    <option value="N">牛顿 (N)</option>
                                    <option value="Pa">帕斯卡 (Pa)</option>
                                    <option value="J">焦耳 (J)</option>
                                    <option value="W">瓦特 (W)</option>
                                    <option value="V">伏特 (V)</option>
                                    <option value="Ω">欧姆 (Ω)</option>
                                    <option value="F">法拉 (F)</option>
                                    <option value="H">亨利 (H)</option>
                                </optgroup>
                                <optgroup label="组合单位">
                                    <option value="m/s">米/秒 (m/s)</option>
                                    <option value="m/s²">米/秒² (m/s²)</option>
                                    <option value="m³">立方米 (m³)</option>
                                    <option value="kg/m³">千克/立方米 (kg/m³)</option>
                                </optgroup>
                                <optgroup label="其他">
                                    <option value="%">百分比 (%)</option>
                                    <option value="°C">摄氏度 (°C)</option>
                                </optgroup>
                            </select>
                        </div>
                        <input type="hidden" id="unit" name="unit" value="">
                    </div>
                    <div class="mb-3">
                        <label for="status" class="form-label">状态</label>
                        <select class="form-select" id="status" name="status" required>
                            <option value="pending">待测试</option>
                            <option value="in_progress">测试中</option>
                            <option value="completed">已完成</option>
                            <option value="failed">测试失败</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="result" class="form-label">测试结果</label>
                        <input type="text" class="form-control" id="result" name="result">
                    </div>
                    <div class="mb-3">
                        <label for="address" class="form-label">地址信息</label>
                        <textarea class="form-control" id="address" name="address" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="photo" class="form-label">测试照片</label>
                        <input type="file" class="form-control" id="photo" name="photo" accept="image/*">
                    </div>
                    <div class="mb-3">
                        <label for="analyzed_by" class="form-label">分析人员</label>
                        <select class="form-select" id="analyzed_by" name="analyzed_by">
                            <option value="">请选择</option>
                            {% for user in users %}
                                <option value="{{ user.id }}">{{ user.username }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="analysis_date" class="form-label">分析日期</label>
                        <input type="datetime-local" class="form-control" id="analysis_date" name="analysis_date">
                    </div>
                    <div class="mb-3">
                        <label for="verified_by" class="form-label">验证人员</label>
                        <select class="form-select" id="verified_by" name="verified_by">
                            <option value="">请选择</option>
                            {% for user in users %}
                                <option value="{{ user.id }}">{{ user.username }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="verification_date" class="form-label">验证日期</label>
                        <input type="datetime-local" class="form-control" id="verification_date" name="verification_date">
                    </div>
                    <button type="submit" class="btn btn-primary">保存</button>
                    <a href="{% url 'test_list' %}" class="btn btn-secondary">取消</a>
                </form>
            </div>
        </div>
    </div>

    <script>
        function updateSampleInfo(select) {
            var option = select.options[select.selectedIndex];
            document.getElementById('sample_type_display').value = option.getAttribute('data-sample-type') || '-';
            document.getElementById('sample_type_desc_display').value = option.getAttribute('data-sample-desc') || '-';
        }

        // 监听选择框变化，更新单位字段
        document.getElementById('unit_prefix').addEventListener('change', updateUnit);
        document.getElementById('unit_base').addEventListener('change', updateUnit);

        function updateUnit() {
            var prefix = document.getElementById('unit_prefix').value;
            var baseUnit = document.getElementById('unit_base').value;
            document.getElementById('unit').value = prefix + baseUnit;
        }

        // 表单提交前确保单位字段已更新
        document.querySelector('form').addEventListener('submit', function(e) {
            updateUnit();
        });
    </script>
{% endblock %}
