{% extends 'core/base.html' %}

{% block title %}添加测试{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">添加测试</h1>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="sample" class="form-label">样品</label>
                        <select class="form-select" id="sample" name="sample" required onchange="updateSampleInfo(this)">
                            <option value="">请选择</option>
                            {% for sample in samples %}
                                <option value="{{ sample.id }}" data-sample-type="{{ sample.sample_type.name|default:'' }}" data-sample-desc="{{ sample.sample_type_description.description|default:'' }}">{{ sample.sample_id }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">样品类型</label>
                        <input type="text" class="form-control" id="sample_type_display" readonly>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">样品类型描述</label>
                        <input type="text" class="form-control" id="sample_type_desc_display" readonly>
                    </div>
                    <div class="mb-3">
                        <label for="status" class="form-label">状态</label>
                        <select class="form-select" id="status" name="status" required>
                            <option value="pending">待测试</option>
                            <option value="in_progress">测试中</option>
                            <option value="completed">已完成</option>
                            <option value="failed">测试失败</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="result" class="form-label">测试结果</label>
                        <input type="text" class="form-control" id="result" name="result">
                    </div>
                    <div class="mb-3">
                        <label for="address" class="form-label">地址信息</label>
                        <textarea class="form-control" id="address" name="address" rows="3"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="photo" class="form-label">测试照片</label>
                        <input type="file" class="form-control" id="photo" name="photo" accept="image/*">
                    </div>
                    <div class="mb-3">
                        <label for="analyzed_by" class="form-label">分析人员</label>
                        <select class="form-select" id="analyzed_by" name="analyzed_by">
                            <option value="">请选择</option>
                            {% for user in users %}
                                <option value="{{ user.id }}">{{ user.username }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="analysis_date" class="form-label">分析日期</label>
                        <input type="datetime-local" class="form-control" id="analysis_date" name="analysis_date">
                    </div>
                    <div class="mb-3">
                        <label for="verified_by" class="form-label">验证人员</label>
                        <select class="form-select" id="verified_by" name="verified_by">
                            <option value="">请选择</option>
                            {% for user in users %}
                                <option value="{{ user.id }}">{{ user.username }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="verification_date" class="form-label">验证日期</label>
                        <input type="datetime-local" class="form-control" id="verification_date" name="verification_date">
                    </div>
                    <button type="submit" class="btn btn-primary">保存</button>
                    <a href="{% url 'test_list' %}" class="btn btn-secondary">取消</a>
                </form>
            </div>
        </div>
    </div>

    <script>
        function updateSampleInfo(select) {
            var option = select.options[select.selectedIndex];
            document.getElementById('sample_type_display').value = option.getAttribute('data-sample-type') || '-';
            document.getElementById('sample_type_desc_display').value = option.getAttribute('data-sample-desc') || '-';
        }
    </script>
{% endblock %}
