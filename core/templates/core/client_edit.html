{% extends 'core/base.html' %}

{% block title %}编辑客户{% endblock %}

{% block content %}
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2">编辑客户</h1>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="name" class="form-label">客户名称</label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ client.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="contact_person" class="form-label">联系人</label>
                        <input type="text" class="form-control" id="contact_person" name="contact_person" value="{{ client.contact_person }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">电子邮件</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ client.email }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="phone" class="form-label">电话</label>
                        <input type="text" class="form-control" id="phone" name="phone" value="{{ client.phone }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="address" class="form-label">地址</label>
                        <textarea class="form-control" id="address" name="address" rows="3" required>{{ client.address }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label for="province" class="form-label">省份</label>
                        <input type="text" class="form-control" id="province" name="province" value="{{ client.province }}">
                    </div>
                    <div class="mb-3">
                        <label for="city" class="form-label">城市</label>
                        <input type="text" class="form-control" id="city" name="city" value="{{ client.city }}">
                    </div>
                    <button type="submit" class="btn btn-primary">保存</button>
                    <a href="{% url 'client_list' %}" class="btn btn-secondary">取消</a>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
